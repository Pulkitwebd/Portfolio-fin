  <body class="light">
    <script>
      // set light/dark before first paint (same logic as the Hugo theme)
      (function () {
        try {
          var pref = localStorage.getItem("pref-theme");
          var dark = pref !== "light"; // dark by default
          if (dark) {
            document.documentElement.classList.add("dark");
            document.body.classList.add("dark");
          }
          window.__dark = dark;
        } catch (e) {}
      })();
    </script>
